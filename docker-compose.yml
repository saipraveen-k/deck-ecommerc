version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: deck-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deck-store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - deck-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: deck-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deck-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: deck-backend
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deck-store
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_here}
      COOKIE_SECRET: ${COOKIE_SECRET:-your_super_secret_cookie_key_here}
      STORE_URL: http://localhost:3000
      ADMIN_URL: http://localhost:9000
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      S3_URL: ${S3_URL:-https://s3.amazonaws.com}
      S3_BUCKET: ${S3_BUCKET:-deck-store}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@deckclothing.com}
    ports:
      - "9000:9000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    networks:
      - deck-network
    restart: unless-stopped
    command: >
      sh -c "npm install && npm run build && npm run dev"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: deck-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_STORE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - deck-network
    restart: unless-stopped
    command: >
      sh -c "npm install && npm run dev"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  deck-network:
    driver: bridge
